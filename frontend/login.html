<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VerifyWeigh</title>

    <link rel="stylesheet" href="login.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="login-page">

        <div id="login-box">

            <div id="login-logo">
                ⚖ VerifyWeigh
            </div>

            <h1>Welcome Back</h1>

            <p id="login-subtitle">
                Login to manage your instrument verification.
            </p>

            <form id="login-form"  novalidate>

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input 
                        type="email" 
                        id="email"
                        placeholder="Enter your email"
                    >
                    <p  class="error-message" id="email-error" role="alert">Please enter a valid email address.</p>

                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input 
                        type="password" 
                        id="password"
                        placeholder="Enter your password"
                    >
                   <p class="help-message" id="password-help">Use 8 or more characters with a mix of letters, numbers, and symbols.</p>

                </div>

                <div id="login-options">

                    <label id="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="">Forgot Password?</a>

                </div>

                <button type="submit" id="login-btn">
                    Login
                </button>

            </form>

            <p id="signup-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
